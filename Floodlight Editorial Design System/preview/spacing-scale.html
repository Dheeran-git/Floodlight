<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="8px system with 4px sub-step" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; display:flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
  .tok { display:flex; flex-direction:column; align-items:center; gap: 8px; }
  .bar { background: var(--accent); border-radius: 1px; width: 100%; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }
</style>
</head>
<body>
<div class="wrap">
  <div class="tok"><div class="bar" style="height:4px;"></div><div class="v">4</div></div>
  <div class="tok"><div class="bar" style="height:8px;"></div><div class="v">8</div></div>
  <div class="tok"><div class="bar" style="height:12px;"></div><div class="v">12</div></div>
  <div class="tok"><div class="bar" style="height:16px;"></div><div class="v">16</div></div>
  <div class="tok"><div class="bar" style="height:20px;"></div><div class="v">20</div></div>
  <div class="tok"><div class="bar" style="height:24px;"></div><div class="v">24</div></div>
  <div class="tok"><div class="bar" style="height:32px;"></div><div class="v">32</div></div>
  <div class="tok"><div class="bar" style="height:40px;"></div><div class="v">40</div></div>
  <div class="tok"><div class="bar" style="height:48px;"></div><div class="v">48</div></div>
  <div class="tok"><div class="bar" style="height:64px;"></div><div class="v">64</div></div>
  <div class="tok"><div class="bar" style="height:80px;"></div><div class="v">80</div></div>
  <div class="tok"><div class="bar" style="height:96px;"></div><div class="v">96</div></div>
</div>
</body>
</html>
