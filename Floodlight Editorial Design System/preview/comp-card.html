<!DOCTYPE html>
<!-- @dsCard group="Components" name="Feature card" subtitle="3px top rule, kicker, serif title, hairline divider" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .card { background: var(--card); border: 1px solid var(--rule-soft); border-top: 3px solid var(--ink); border-radius: 4px; padding: 18px 20px; }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .title { font-family: var(--font-display); font-weight: 600; font-size: 22px; color: var(--ink); margin-top: 6px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
  .copy { font-family: var(--font-ui); font-size: 14px; line-height: 1.6; color: var(--ink-2); margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="kick">Module 03 / Optimization</div>
    <div class="title">Route optimization under load</div>
    <div class="copy">A lead feature block: 3px top rule, mono kicker, serif title, hairline divider, then sans body. Flat — the edge is a rule, never a shadow.</div>
  </div>
</div>
</body>
</html>
