<!DOCTYPE html>
<!-- @dsCard group="Brand" name="App mark" subtitle="Serif F on ink with vermillion floodline; reversed variant" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); display:flex; align-items:center; gap: 36px; height: 100vh; padding: 0 40px; box-sizing:border-box; }
  .mark { width: 88px; height: 88px; background: var(--ink); border-radius: 2px; display:flex; align-items:center; justify-content:center; position: relative; flex-shrink:0; }
  .mark span { font-family: var(--font-display); font-weight: 600; font-size: 58px; color: var(--paper); line-height:1; }
  .mark .fl { position:absolute; bottom: 16px; left: 18px; right: 18px; height: 3px; background: var(--emphasis); }
  .alt { width: 88px; height: 88px; background: var(--paper); border: 1px solid var(--ink); border-radius: 2px; display:flex; align-items:center; justify-content:center; position: relative; flex-shrink:0; }
  .alt span { font-family: var(--font-display); font-weight: 600; font-size: 58px; color: var(--ink); line-height:1; }
  .alt .fl { position:absolute; bottom: 16px; left: 18px; right: 18px; height: 3px; background: var(--emphasis); }
  .note { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); line-height: 1.6; }
</style>
</head>
<body>
  <div class="mark"><span>F</span><div class="fl"></div></div>
  <div class="alt"><span>F</span><div class="fl"></div></div>
  <div class="note">App icon &amp; favicon.<br>Serif F on ink, with<br>the vermillion floodline.<br>Reversed variant on paper.</div>
</body>
</html>
