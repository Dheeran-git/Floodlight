<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Paper & surfaces" subtitle="Warm broadsheet stock — paper, raised, card" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 0; border: 1px solid var(--rule-soft); border-radius: var(--radius-md); overflow: hidden; }
  .sw { flex: 1; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw" style="background:#F6F3EC; color:#16140F; border-right:1px solid var(--rule-soft);">
      <div class="name">--paper</div><div class="hex">#F6F3EC</div>
    </div>
    <div class="sw" style="background:#FBFAF5; color:#16140F; border-right:1px solid var(--rule-soft);">
      <div class="name">--paper-raised</div><div class="hex">#FBFAF5</div>
    </div>
    <div class="sw" style="background:#FFFFFF; color:#16140F;">
      <div class="name">--card</div><div class="hex">#FFFFFF</div>
    </div>
  </div>
</div>
</body>
</html>
