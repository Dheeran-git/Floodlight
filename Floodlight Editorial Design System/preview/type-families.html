<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type families" subtitle="Newsreader · Libre Franklin · Spline Sans Mono" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 20px 26px; display:grid; grid-template-columns: repeat(3,1fr); gap: 0; }
  .fam { padding: 0 18px; border-right: 1px solid var(--rule-soft); }
  .fam:first-child { padding-left: 0; }
  .fam:last-child { border-right: 0; padding-right: 0; }
  .glyph { font-size: 52px; line-height: 1; margin-bottom: 10px; color: var(--ink); }
  .nm { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink); }
  .role { font-family: var(--font-ui); font-size: 11.5px; color: var(--ink-3); margin-top: 3px; line-height:1.4; }
</style>
</head>
<body>
<div class="wrap">
  <div class="fam">
    <div class="glyph" style="font-family:var(--font-display); font-weight:600;">Aa</div>
    <div class="nm">Newsreader</div>
    <div class="role">Serif display — headlines, pull-quotes, stat numbers</div>
  </div>
  <div class="fam">
    <div class="glyph" style="font-family:var(--font-ui); font-weight:600;">Aa</div>
    <div class="nm">Libre Franklin</div>
    <div class="role">Body &amp; UI — copy, labels, tables, buttons</div>
  </div>
  <div class="fam">
    <div class="glyph" style="font-family:var(--font-mono); font-weight:500;">Aa</div>
    <div class="nm">Spline Sans Mono</div>
    <div class="role">Kickers, datelines, coords, data</div>
  </div>
</div>
</body>
</html>
