<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Ink scale" subtitle="Near-black text ramp, never pure #000" viewport="700x140" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .row { display: flex; gap: 0; border: 1px solid var(--rule-soft); border-radius: var(--radius-md); overflow: hidden; }
  .sw { flex: 1; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; color: #F6F3EC; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.75; margin-top: 2px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="sw" style="background:#16140F;"><div class="name">--ink</div><div class="hex">#16140F</div></div>
    <div class="sw" style="background:#3A362E;"><div class="name">--ink-2</div><div class="hex">#3A362E</div></div>
    <div class="sw" style="background:#6B655A;"><div class="name">--ink-3</div><div class="hex">#6B655A</div></div>
    <div class="sw" style="background:#9A9384;"><div class="name">--ink-4</div><div class="hex">#9A9384</div></div>
  </div>
</div>
</body>
</html>
