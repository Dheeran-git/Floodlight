<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Emphasis — vermillion" subtitle="Pull-stats & genuine urgency, rationed like ink" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; display: flex; gap: 16px; align-items: stretch; }
  .big { flex: 2; border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 96px; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.85; }
  .side { flex: 1; display: flex; flex-direction: column; gap: 10px; justify-content:center; }
  .chip { border: 1px solid var(--rule-soft); border-radius: var(--radius-sm); padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; display:flex; justify-content:space-between; align-items:center; }
  .dot { width: 16px; height: 16px; border-radius: 2px; }
  .stat { font-family: var(--font-display); font-weight: 600; font-size: 44px; color:#CC3B2B; line-height:1; letter-spacing:-0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <div class="big" style="background:#CC3B2B; color:#FFF;">
    <div class="name">--emphasis · vermillion</div>
    <div>
      <div style="font-size:13px; margin-bottom:6px;">Pull-stats &amp; genuine urgency</div>
      <div class="hex">#CC3B2B</div>
    </div>
  </div>
  <div class="side">
    <div class="stat">₹225 cr</div>
    <div class="chip"><span>--emphasis-tint</span><span class="dot" style="background:#CC3B2B; opacity:0.08;"></span></div>
  </div>
</div>
</body>
</html>
