<!DOCTYPE html>
<!-- @dsCard group="Components" name="Data table" subtitle="Mono header, ruled rows, tabular figures, severity tick" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  table { width: 100%; border-collapse: collapse; }
  th { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); text-align: left; padding: 0 0 9px; border-bottom: 1px solid var(--rule); font-weight: 500; }
  td { font-family: var(--font-ui); font-size: 14px; color: var(--ink-2); padding: 10px 0; border-bottom: 1px solid var(--rule-soft); }
  .num { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
  th.r { text-align: right; }
  .tick { display:inline-block; width: 8px; height: 8px; border-radius: 1px; margin-right: 8px; vertical-align: middle; }
  .ward { font-family: var(--font-display); }
</style>
</head>
<body>
<div class="wrap">
  <table>
    <thead><tr><th>Ward</th><th class="r">Reports</th><th class="r">Depth (cm)</th></tr></thead>
    <tbody>
      <tr><td><span class="tick" style="background:#CC3B2B;"></span><span class="ward">Bellandur</span></td><td class="num">48</td><td class="num">182</td></tr>
      <tr><td><span class="tick" style="background:#C9711B;"></span><span class="ward">Whitefield</span></td><td class="num">31</td><td class="num">120</td></tr>
      <tr><td><span class="tick" style="background:#B0860F;"></span><span class="ward">Koramangala</span></td><td class="num">22</td><td class="num">74</td></tr>
      <tr><td><span class="tick" style="background:#2E7D5B;"></span><span class="ward">Indiranagar</span></td><td class="num">6</td><td class="num">12</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
