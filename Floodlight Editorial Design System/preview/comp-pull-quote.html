<!DOCTYPE html>
<!-- @dsCard group="Components" name="Pull-quote" subtitle="Serif italic, vermillion left rule, mono byline" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 26px; }
  .pq { border-left: 3px solid var(--emphasis); padding-left: 20px; }
  .q { font-family: var(--font-display); font-style: italic; font-weight: 500; font-size: 27px; line-height: 1.3; color: var(--ink); max-width: 560px; }
  .by { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="pq">
    <div class="q">"By the time the official map updated, the water was already at the second floor."</div>
    <div class="by">R. Iyer — Ward 174 Volunteer Coordinator</div>
  </div>
</div>
</body>
</html>
