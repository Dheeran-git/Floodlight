<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Flood depth & map markers" subtitle="Muted blue depth ramp + route/team/shelter ticks" viewport="700x170" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
  .ramp { display: flex; border: 1px solid var(--rule-soft); border-radius: var(--radius-sm); overflow: hidden; }
  .step { flex: 1; height: 54px; display:flex; align-items:flex-end; padding: 6px; }
  .lab { font-family: var(--font-mono); font-size: 10px; }
  .markers { display: flex; gap: 22px; margin-top: 16px; }
  .mk { display:flex; align-items:center; gap: 7px; font-family: var(--font-mono); font-size: 11px; color: var(--ink-2); }
  .tick { width: 14px; height: 0; border-top: 3px solid; }
  .dashed { border-top: 3px dashed #CC3B2B; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kick">Flood depth ramp · 70% on basemap</div>
  <div class="ramp">
    <div class="step" style="background:#CBD7EE;"><span class="lab">flood-1</span></div>
    <div class="step" style="background:#93AEDC;"><span class="lab">flood-2</span></div>
    <div class="step" style="background:#5C84C8; color:#fff;"><span class="lab">flood-3</span></div>
    <div class="step" style="background:#2A4FA0; color:#fff;"><span class="lab">flood-4</span></div>
  </div>
  <div class="markers">
    <div class="mk"><span class="tick" style="border-color:#1B3FA0;"></span>route</div>
    <div class="mk"><span class="tick dashed"></span>blocked</div>
    <div class="mk"><span class="tick" style="border-color:#C9711B;"></span>team</div>
    <div class="mk"><span class="tick" style="border-color:#2E7D5B;"></span>shelter</div>
  </div>
</div>
</body>
</html>
