<!DOCTYPE html>
<!-- @dsCard group="Type" name="Display serif" subtitle="Pull-stat, display-xl, display-l in Newsreader" viewport="700x220" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 14px; }
  .spec { font-family: var(--font-display); font-weight: 600; color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="line">
    <div class="spec" style="font-size:64px; letter-spacing:-0.02em; line-height:0.98; color:#CC3B2B; font-variant-numeric:tabular-nums;">210</div>
    <div class="meta">pull-stat · 64px · 600 · -0.02em</div>
  </div>
  <div class="line">
    <div class="spec" style="font-size:46px; letter-spacing:-0.01em; line-height:1.04;">When the water rises</div>
    <div class="meta">display-xl · 52px · 600</div>
  </div>
  <div class="line" style="margin-bottom:0;">
    <div class="spec" style="font-size:34px; letter-spacing:-0.01em; line-height:1.08;">A city that floods each monsoon</div>
    <div class="meta">display-l · 38px · 600</div>
  </div>
</div>
</body>
</html>
