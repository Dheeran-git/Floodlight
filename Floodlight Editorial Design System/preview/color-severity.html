<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Severity tones" subtitle="Muted infographic severity ramp P0–INFO" viewport="700x130" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .sev { border: 1px solid var(--rule-soft); border-radius: var(--radius-sm); overflow: hidden; }
  .bar { height: 40px; }
  .meta { padding: 8px 10px; }
  .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; font-weight: 500; }
  .hex { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sev"><div class="bar" style="background:#CC3B2B;"></div><div class="meta"><div class="tag">P0 SOS</div><div class="hex">#CC3B2B</div></div></div>
  <div class="sev"><div class="bar" style="background:#C9711B;"></div><div class="meta"><div class="tag">P1 URGENT</div><div class="hex">#C9711B</div></div></div>
  <div class="sev"><div class="bar" style="background:#B0860F;"></div><div class="meta"><div class="tag">P2 WATCH</div><div class="hex">#B0860F</div></div></div>
  <div class="sev"><div class="bar" style="background:#2E7D5B;"></div><div class="meta"><div class="tag">STABLE</div><div class="hex">#2E7D5B</div></div></div>
  <div class="sev"><div class="bar" style="background:#1B3FA0;"></div><div class="meta"><div class="tag">INFO</div><div class="hex">#1B3FA0</div></div></div>
</div>
</body>
</html>
