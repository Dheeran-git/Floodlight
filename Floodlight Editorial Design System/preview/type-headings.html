<!DOCTYPE html>
<!-- @dsCard group="Type" name="Headings" subtitle="h1 / h2 serif, h3 sans" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; }
  .meta { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); letter-spacing: 0.04em; }
  .line { display: flex; align-items: baseline; justify-content: space-between; gap: 20px; margin-bottom: 16px; }
  .line:last-child { margin-bottom: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="line">
    <div style="font-family:var(--font-display); font-weight:600; font-size:30px; line-height:1.15;">Responder command desk</div>
    <div class="meta">h1 · Newsreader · 30px · 600</div>
  </div>
  <div class="line">
    <div style="font-family:var(--font-display); font-weight:600; font-size:23px; line-height:1.2;">Live crisis map</div>
    <div class="meta">h2 · Newsreader · 23px · 600</div>
  </div>
  <div class="line">
    <div style="font-family:var(--font-ui); font-weight:700; font-size:18px; line-height:1.3;">Queued reports</div>
    <div class="meta">h3 · Libre Franklin · 18px · 700</div>
  </div>
</div>
</body>
</html>
