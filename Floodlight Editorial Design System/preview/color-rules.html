<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Rules" subtitle="The newspaper signature — strong & soft hairlines" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 24px 26px; display: flex; flex-direction: column; gap: 20px; }
  .item { }
  .label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--ink-3); margin-bottom: 9px; display:flex; justify-content:space-between; }
  .rule-strong { height: 0; border-top: 1px solid var(--rule); }
  .rule-soft-d { height: 0; border-top: 1px solid var(--rule-soft); }
  .rule-3 { height: 3px; background: var(--ink); }
  .cap { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="item">
    <div class="label"><span>--rule · 1px</span><span>#16140F</span></div>
    <div class="rule-strong"></div>
  </div>
  <div class="item">
    <div class="label"><span>--rule (3px masthead cap)</span><span>#16140F</span></div>
    <div class="rule-3"></div>
  </div>
  <div class="item">
    <div class="label"><span>--rule-soft · 1px</span><span>#DAD4C6</span></div>
    <div class="rule-soft-d"></div>
  </div>
</div>
</body>
</html>
