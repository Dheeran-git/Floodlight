<!DOCTYPE html>
<!-- @dsCard group="Components" name="SOS report row" subtitle="Ruled list row — tick, serif summary, mono meta, Dispatch" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 18px 26px; }
  .row { display:flex; align-items:flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--rule-soft); }
  .row:last-child { border-bottom: 0; }
  .tick { width: 3px; align-self: stretch; border-radius: 1px; }
  .main { flex: 1; }
  .sum { font-family: var(--font-display); font-size: 17px; color: var(--ink); line-height: 1.3; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-top: 6px; letter-spacing: 0.02em; }
  .act { font-family: var(--font-ui); font-weight: 600; font-size: 13px; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; align-self: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="row">
    <div class="tick" style="background:#CC3B2B;"></div>
    <div class="main">
      <div class="sum">Elderly trapped, 2nd floor — Whitefield</div>
      <div class="meta">RPT-2048 · 12.97°N 77.59°E · T+04:12</div>
    </div>
    <a class="act">Dispatch</a>
  </div>
  <div class="row">
    <div class="tick" style="background:#C9711B;"></div>
    <div class="main">
      <div class="sum">Road blocked by debris — Sarjapur junction</div>
      <div class="meta">RPT-2051 · 12.91°N 77.68°E · T+04:18</div>
    </div>
    <a class="act">Dispatch</a>
  </div>
</div>
</body>
</html>
