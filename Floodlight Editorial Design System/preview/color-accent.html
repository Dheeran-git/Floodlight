<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Accent — ink-blue" subtitle="Links & interactive only" viewport="700x150" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 22px 26px; display: flex; gap: 16px; align-items: stretch; }
  .big { flex: 2; border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 96px; }
  .name { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.8; }
  .side { flex: 1; display: flex; flex-direction: column; gap: 10px; }
  .chip { border: 1px solid var(--rule-soft); border-radius: var(--radius-sm); padding: 8px 10px; font-family: var(--font-mono); font-size: 11px; display:flex; justify-content:space-between; align-items:center; }
  .dot { width: 16px; height: 16px; border-radius: 2px; }
  .demo { font-family: var(--font-ui); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="big" style="background:#1B3FA0; color:#FFF;">
    <div class="name">--accent · ink-blue</div>
    <div>
      <div class="demo" style="margin-bottom:6px;">Links &amp; interactive only</div>
      <div class="hex">#1B3FA0</div>
    </div>
  </div>
  <div class="side">
    <div class="chip"><span>--accent-press</span><span class="dot" style="background:#142F7A;"></span></div>
    <div class="chip"><span>--accent-tint</span><span class="dot" style="background:#1B3FA0; opacity:0.08;"></span></div>
    <div class="chip" style="border-color:#1B3FA0; color:#1B3FA0;"><span style="text-decoration:underline; text-underline-offset:2px;">Dispatch link</span><span>→</span></div>
  </div>
</div>
</body>
</html>
