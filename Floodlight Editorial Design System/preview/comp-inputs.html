<!DOCTYPE html>
<!-- @dsCard group="Components" name="Inputs & AI query desk" subtitle="Form line inputs + mono QUERY desk" viewport="700x190" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 24px 26px; display:flex; flex-direction:column; gap: 16px; }
  .field label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); display:block; margin-bottom: 7px; }
  .input { background: var(--card); border: 1px solid var(--rule-soft); border-bottom-color: var(--ink-3); border-radius: 3px; padding: 11px 13px; font-family: var(--font-ui); font-size: 15px; color: var(--ink); width: 100%; box-sizing: border-box; }
  .input.focus { border-color: var(--accent); background: rgba(27,63,160,0.04); outline: none; }
  .ai { display:flex; align-items:center; background: var(--card); border: 1px solid var(--accent); border-radius: 3px; padding: 11px 13px; gap: 10px; }
  .ai .q { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-3); }
  .ai input { border:0; outline:0; font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--ink-3); flex:1; background:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="field">
    <label>WARD</label>
    <input class="input focus" value="Bellandur · Ward 174">
  </div>
  <div class="field">
    <label>AI QUERY DESK</label>
    <div class="ai">
      <span class="q">QUERY —</span>
      <input value="which shelter exceeds capacity next?" readonly>
    </div>
  </div>
</div>
</body>
</html>
