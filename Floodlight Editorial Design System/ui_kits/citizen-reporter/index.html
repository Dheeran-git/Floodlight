<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Citizen Reporter" name="Citizen Reporter — PWA" subtitle="Mobile emergency report flow — home / triage / compose / queued" viewport="940x600" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floodlight — Citizen Reporter</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #E7E3DA; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; font-family: 'Libre Franklin', sans-serif; overflow: hidden; }
  #root { display: flex; justify-content: center; }
  #fit { transform-origin: center center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="CitizenReporter.jsx"></script>
<script type="text/babel">
  function App() {
    return (
      <div id="fit">
        <IOSDevice>
          <CitizenApp />
        </IOSDevice>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  function fit() {
    const el = document.getElementById('fit');
    if (!el) return;
    const s = Math.min(1, (window.innerHeight - 32) / 874, (window.innerWidth - 32) / 402);
    el.style.transform = `scale(${s})`;
  }
  window.addEventListener('resize', fit);
  setTimeout(fit, 50); setTimeout(fit, 400);
</script>
</body>
</html>
