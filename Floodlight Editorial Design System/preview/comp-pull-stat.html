<!DOCTYPE html>
<!-- @dsCard group="Components" name="Pull-stat block" subtitle="Signature — giant vermillion Newsreader number" viewport="700x200" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 24px 26px; display:flex; gap: 36px; }
  .ps { display:flex; gap: 16px; }
  .side { width: 0; border-left: 1px solid var(--rule); }
  .body { }
  .kick { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
  .num { font-family: var(--font-display); font-weight: 600; font-size: 72px; line-height: 0.92; letter-spacing: -0.02em; color: var(--emphasis); font-variant-numeric: tabular-nums; }
  .cap { font-family: var(--font-display); font-size: 16px; color: var(--ink-2); margin-top: 8px; max-width: 220px; line-height: 1.3; }
</style>
</head>
<body>
<div class="wrap">
  <div class="ps">
    <div class="side"></div>
    <div class="body">
      <div class="kick">Displaced · 2025 monsoon</div>
      <div class="num">210</div>
      <div class="cap">families relocated from Bellandur in 36 hours.</div>
    </div>
  </div>
  <div class="ps">
    <div class="side"></div>
    <div class="body">
      <div class="kick">Damage estimate</div>
      <div class="num">₹225 cr</div>
      <div class="cap">infrastructure loss, southeast wards.</div>
    </div>
  </div>
</div>
</body>
</html>
