<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Wordmark" subtitle="Serif Floodlight, vermillion period, masthead edition line" viewport="700x230" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); display:flex; align-items:center; justify-content:center; height: 100vh; }
  .mast { width: 480px; }
  .rule3 { height: 3px; background: var(--ink); }
  .edition { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3); margin-top: 8px; }
  .wm { font-family: var(--font-display); font-weight: 600; font-size: 56px; letter-spacing: -0.5px; color: var(--ink); margin-top: 4px; position: relative; display:inline-block; }
  .dot { color: var(--emphasis); }
  .tag { font-family: var(--font-display); font-style: italic; font-size: 16px; color: var(--ink-2); margin-top: 2px; }
</style>
</head>
<body>
<div class="mast">
  <div class="rule3"></div>
  <div class="edition">FLOOD-RESPONSE COORDINATION · BENGALURU EDITION</div>
  <div class="wm">Floodlight<span class="dot">.</span></div>
  <div class="tag">Clarity when the water rises.</div>
</div>
</body>
</html>
