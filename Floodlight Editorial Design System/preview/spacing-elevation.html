<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Elevation" subtitle="Flat — edges are rules; shadow only on floating UI" viewport="700x180" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); }
  .wrap { padding: 26px; display:flex; gap: 22px; align-items: center; }
  .tok { flex:1; text-align:center; }
  .box { height: 78px; border-radius: var(--radius-md); display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px; color:var(--ink-3); }
  .e1 { background: var(--card); box-shadow: 0 0 0 1px var(--rule-soft); }
  .e2 { background: var(--card); box-shadow: 0 14px 36px -16px rgba(20,18,15,0.22); }
  .e3 { background: var(--card); box-shadow: 0 1px 0 var(--rule); }
  .nm { font-family: var(--font-mono); font-size: 11px; color: var(--ink); margin-top: 12px; }
  .v { font-family: var(--font-ui); font-size: 11px; color: var(--ink-3); margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="tok"><div class="box e1">card</div><div class="nm">--elev-card</div><div class="v">edge = rule, not shadow</div></div>
  <div class="tok"><div class="box e2">menu</div><div class="nm">--elev-pop</div><div class="v">dropdowns / modals only</div></div>
  <div class="tok"><div class="box e3">header</div><div class="nm">--elev-sticky</div><div class="v">1px bottom rule</div></div>
</div>
</body>
</html>
