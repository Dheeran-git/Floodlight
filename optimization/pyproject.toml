[project]
name = "floodlight-optimization"
version = "0.1.0"
description = "Floodlight — Optimization engine for rescue routing and resource allocation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.3",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The importable package is the PEP 420 namespace ``optimization.engine``
# resolved from the repo root (kept namespace-clean: no ``optimization/__init__.py``).
# Ship the local ``engine/`` package so the wheel builds; tests and the backend
# import via the ``optimization`` namespace with the repo root on ``sys.path``.
[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so ``import optimization.engine`` resolves from
# source during tests via the PEP 420 namespace package.
pythonpath = [".."]
testpaths = ["tests"]
