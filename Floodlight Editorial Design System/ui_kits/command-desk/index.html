<!DOCTYPE html>
<!-- @dsCard group="UI Kit — Command Desk" name="Command Desk — web" subtitle="Editorial situation desk — masthead, crisis map, live wire, query desk" viewport="1320x620" -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Floodlight — Responder Command Desk</title>
<link rel="stylesheet" href="../../colors_and_type.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); font-family: 'Libre Franklin', sans-serif; }
  #root { height: 100vh; }
  ::selection { background: rgba(27,63,160,0.16); }
  /* Desaturate CARTO tiles toward the warm paper palette */
  .paper-map { background: var(--paper); }
  .paper-map .leaflet-tile {
    filter: grayscale(1) brightness(1.04) contrast(0.9) sepia(0.34) saturate(0.7) hue-rotate(-8deg);
  }
  .paper-map .leaflet-container { background: var(--paper); font-family: 'Libre Franklin', sans-serif; }
  .leaflet-marker-icon { background: none; border: 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Data.jsx"></script>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="CrisisMap.jsx"></script>
<script type="text/babel" src="Wire.jsx"></script>
<script type="text/babel">
  function Toast({ report, onClose }) {
    React.useEffect(() => { const t = setTimeout(onClose, 3200); return () => clearTimeout(t); }, [report]);
    return (
      <div style={{ position: 'fixed', left: '50%', bottom: 28, transform: 'translateX(-50%)', background: FL.card, border: `1px solid ${FL.rule}`, borderRadius: 4, padding: '14px 18px', boxShadow: '0 14px 36px -16px rgba(20,18,15,0.22)', display: 'flex', alignItems: 'center', gap: 14, zIndex: 100, minWidth: 360 }}>
        <Icon name="radio" size={20} color={FL.emphasis} />
        <div style={{ flex: 1 }}>
          <div style={{ fontFamily: FL.ui, fontWeight: 700, fontSize: 14, color: FL.ink }}>Team dispatched to {report.place}</div>
          <div style={{ fontFamily: FL.mono, fontSize: 11, color: FL.ink3, marginTop: 3 }}>{report.id} · {report.coord} · ETA 9 MIN · ROUTE OPTIMIZED</div>
        </div>
        <button onClick={onClose} style={{ background: 'none', border: 0, cursor: 'pointer', fontFamily: FL.mono, fontSize: 11, color: FL.accent }}>DISMISS</button>
      </div>
    );
  }

  function App() {
    const [active, setActive] = React.useState('map');
    const [selected, setSelected] = React.useState('RPT-2051');
    const [toast, setToast] = React.useState(null);
    return (
      <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: FL.paper }}>
        <Masthead dateline="BENGALURU — 18 MAY · 22:14 IST · ED. 1.0" />
        <div style={{ flex: 1, display: 'flex', minHeight: 0 }}>
          <LeftRail active={active} onSelect={setActive} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <StatStrip />
            <CrisisMap selected={selected} onSelect={setSelected} />
          </div>
          <WireColumn selected={selected} onSelect={setSelected} onDispatch={(r) => setToast(r)} />
        </div>
        {toast && <Toast report={toast} onClose={() => setToast(null)} />}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
